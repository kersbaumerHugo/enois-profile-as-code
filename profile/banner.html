<style>
/* Componente isolado: estilos nunca alteram a página do Énóis */
#hk-banner-enois, #hk-banner-enois * { box-sizing: border-box; }
#hk-banner-enois {
  --hk-purple:#aa80ff; --hk-blue:#89b8ff; --hk-ink:#e9ecff;
  position:relative; isolation:isolate; overflow:hidden; width:100%;
  min-height:245px; aspect-ratio:2.5 / 1; border-radius:16px;
  border:1px solid rgba(172,139,255,.27);
  color:var(--hk-ink); background:
    radial-gradient(ellipse at 71% 18%, rgba(115,68,185,.21),transparent 46%),
    radial-gradient(ellipse at 8% 83%,rgba(73,86,176,.12),transparent 56%),
    #090d1b; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  box-shadow:inset 0 0 50px rgba(0,0,0,.3);
}
#hk-banner-enois:before {content:"";pointer-events:none;position:absolute;inset:0;opacity:.37;z-index:0;
  background-image:linear-gradient(rgba(130,118,201,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(130,118,201,.075) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(90deg,#000 0%,transparent 88%);
}
#hk-banner-enois:after {content:"";position:absolute;inset:0;pointer-events:none;z-index:7;
 background:linear-gradient(180deg,rgba(0,0,0,.1),transparent 24%, transparent 78%,rgba(0,0,0,.22));}
#hk-banner-enois .hk-bp {position:absolute;z-index:1;left:-3%;top:0;width:42%;height:100%;opacity:.78;}
#hk-banner-enois .hk-bp-gear-main {transform-box:fill-box;transform-origin:center;animation:hk-gear-turn 38s linear infinite;}
#hk-banner-enois .hk-bp-gear-small {transform-box:fill-box;transform-origin:center;animation:hk-gear-turn 29s linear infinite reverse;}
#hk-banner-enois .hk-bridge {position:absolute;z-index:1;inset:0 auto 0 24%;width:72%;height:100%;overflow:visible;}
#hk-banner-enois .hk-bridge path {fill:none;stroke:url(#hk-line-grad);stroke-width:1.2;stroke-dasharray:7 12;animation:hk-signal 9s linear infinite;opacity:.63;}
#hk-banner-enois .hk-bridge path:nth-of-type(2){animation-duration:13s;animation-direction:reverse;opacity:.47;}
#hk-banner-enois .hk-bridge path:nth-of-type(3){animation-duration:11s;opacity:.39;}
#hk-banner-enois .hk-bridge circle {fill:#b59aff;animation:hk-blink 3s ease-in-out infinite;}
#hk-banner-enois .hk-bridge circle:nth-of-type(2){animation-delay:1s;}
#hk-banner-enois .hk-bridge circle:nth-of-type(3){animation-delay:2s;}
#hk-banner-enois .hk-code-zone {position:absolute;z-index:2;right:2.7%;top:9%;width:28%;height:77%;display:flex;flex-direction:column;gap:11px;align-items:stretch;opacity:.92;}
#hk-banner-enois .hk-window{overflow:hidden;background:rgba(10,13,28,.78);border:1px solid rgba(163,127,255,.36);border-radius:9px;box-shadow:0 9px 30px rgba(2,3,15,.35),inset 0 0 20px rgba(116,84,193,.045);backdrop-filter:blur(4px);}
#hk-banner-enois .hk-window-head{height:23px;display:flex;gap:5px;padding:0 11px;align-items:center;border-bottom:1px solid rgba(151,123,227,.16);font:9px ui-monospace,monospace;color:#93a4c1;}
#hk-banner-enois .hk-window-head i{height:5px;width:5px;display:block;border-radius:50%;background:#986bf2;opacity:.9}
#hk-banner-enois .hk-window-head span{margin-left:auto;white-space:nowrap;}
#hk-banner-enois .hk-window-body{padding:10px 12px;color:#b6c3de;font:clamp(7px,.73vw,11px)/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;}
#hk-banner-enois .hk-window-body .hk-prompt{color:#a68bff;}
#hk-banner-enois .hk-window-body .hk-success{color:#8bd8bf;}
#hk-banner-enois .hk-window-body .hk-cursor{display:inline-block;vertical-align:-2px;width:6px;height:1.1em;background:#b78aff;animation:hk-blink 1.1s steps(1) infinite;}
#hk-banner-enois .hk-nodes {flex:1;display:grid;grid-template-columns:1fr 20px 1fr 20px 1fr;align-items:center;gap:4px;min-height:36px;padding:2px 4px;}
#hk-banner-enois .hk-node {display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;gap:6px;color:#c4b8f2;font:9px ui-monospace,monospace;}
#hk-banner-enois .hk-node-symbol{width:34px;height:34px;border:1px solid rgba(169,135,255,.58);display:grid;place-items:center;border-radius:9px;color:#b69aff;background:rgba(87,53,142,.14);font-size:17px;box-shadow:0 0 24px rgba(135,79,230,.13);}
#hk-banner-enois .hk-node-flow{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#a182fa,transparent);position:relative;overflow:hidden;}
#hk-banner-enois .hk-node-flow:after{content:"";position:absolute;width:10px;height:100%;left:-10px;background:#e4d6ff;box-shadow:0 0 9px #9f82ff;animation:hk-flow 2.5s linear infinite;}
#hk-banner-enois .hk-title-zone{position:absolute;z-index:5;left:32%;top:47%;transform:translateY(-50%);width:48%;text-shadow:0 3px 25px #070b19, 0 1px 7px #070b19;}
#hk-banner-enois .hk-title-zone:before{content:"";position:absolute;z-index:-1;inset:-30px -23px;background:radial-gradient(ellipse,rgba(9,13,27,.94),rgba(9,13,27,.45) 50%,transparent 75%);pointer-events:none;}
#hk-banner-enois .hk-eyebrow{display:flex;gap:9px;align-items:center;font:500 clamp(8px,.84vw,12px)/1.3 ui-monospace,Consolas,monospace;letter-spacing:.19em;white-space:nowrap;color:#b1b6d6;margin-bottom:12px;}
#hk-banner-enois .hk-eyebrow strong{color:#be92ff;}
#hk-banner-enois .hk-title-zone h1{font-size:clamp(25px,3.5vw,57px);line-height:.95;letter-spacing:-.055em;font-weight:850;margin:0 0 13px;}
#hk-banner-enois .hk-title-zone h1 span{display:block;}
#hk-banner-enois .hk-title-zone h1 span:last-child{color:#c4a3ff;text-shadow:0 0 22px rgba(132,80,219,.3),0 1px 8px #070b19;}
#hk-banner-enois .hk-title-zone p{margin:0;color:#dae0f4;font:clamp(10px,1.13vw,16px)/1.5 ui-monospace,Consolas,monospace;letter-spacing:.008em;max-width:430px;}
#hk-banner-enois .hk-banner-footer{position:absolute;z-index:6;left:32%;bottom:9%;font:500 clamp(8px,.8vw,11px)/1.4 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:#9c9dbf;display:flex;align-items:center;gap:11px;white-space:nowrap;}
#hk-banner-enois .hk-banner-footer:before{content:"";width:27px;height:1px;background:#9276d2;}
#hk-banner-enois .hk-banner-live{position:absolute;z-index:6;right:2.7%;bottom:4.2%;display:flex;align-items:center;gap:7px;color:#9fb9ac;font:500 9px ui-monospace,monospace;letter-spacing:.1em;}
#hk-banner-enois .hk-live-dot {width:5px;height:5px;border-radius:50%;background:#8de1c1;box-shadow:0 0 9px #79cfb6;animation:hk-blink 2.5s ease infinite;}
@keyframes hk-gear-turn {to {transform:rotate(360deg)}}
@keyframes hk-signal {to {stroke-dashoffset:-180}}
@keyframes hk-blink {0%,100%{opacity:.95}50%{opacity:.18}}
@keyframes hk-flow{to{left:110%}}
@media (max-width:750px){
 #hk-banner-enois{min-height:222px;aspect-ratio:2.35/1;}
 #hk-banner-enois .hk-bp{left:-16%;width:57%;opacity:.8;}
 #hk-banner-enois .hk-title-zone{left:32%;width:65%;top:44%;}
 #hk-banner-enois .hk-title-zone h1{font-size:clamp(24px,4.4vw,36px);margin-bottom:11px;}
 #hk-banner-enois .hk-title-zone p{font-size:clamp(10px,1.8vw,13px);max-width:290px;}
 #hk-banner-enois .hk-eyebrow{font-size:9px;letter-spacing:.095em;margin-bottom:10px;}
 #hk-banner-enois .hk-code-zone{right:-2%;top:12%;width:33%;height:65%;opacity:.37;filter:blur(.3px);}
 #hk-banner-enois .hk-nodes{display:none;}
 #hk-banner-enois .hk-banner-footer{left:32%;bottom:10%;font-size:8px;letter-spacing:.04em;}
 #hk-banner-enois .hk-banner-live{right:4%;bottom:4%;font-size:7px;}
}
@media (max-width:430px){
 #hk-banner-enois{min-height:214px;border-radius:12px;}
 #hk-banner-enois .hk-bp{left:-24%;width:67%;}
 #hk-banner-enois .hk-title-zone{left:29%;width:69%;}
 #hk-banner-enois .hk-title-zone h1{font-size:27px;}
 #hk-banner-enois .hk-title-zone p{font-size:10px;}
 #hk-banner-enois .hk-eyebrow{font-size:8px;}
 #hk-banner-enois .hk-code-zone{right:-10%;width:43%;opacity:.27;}
 #hk-banner-enois .hk-banner-footer{left:29%;}
}
@media (prefers-reduced-motion:reduce){
 #hk-banner-enois *,#hk-banner-enois *::before,#hk-banner-enois *::after{animation:none!important;transition:none!important;}
}
</style>
