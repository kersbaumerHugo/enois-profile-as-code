# Publish has moved to an interactive, short-lived session on the operator's workstation.
# This workflow intentionally NEVER authenticates to Énóis or performs PATCH.
name: Preview Énóis profile drift (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline check
        run: |
          python scripts/enois_profile.py check
          python -m unittest discover -s tests -v
      - name: Read-only comparison
        env:
          ENOIS_CLIENT_ORIGIN: ${{ vars.ENOIS_CLIENT_ORIGIN }}
        run: python scripts/enois_profile.py plan
